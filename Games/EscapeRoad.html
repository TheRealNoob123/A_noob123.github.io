<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Road</title>
    <link rel="stylesheet" href="pages.css">
</head>
<body>
    <header>
        <h1>Escape Road</h1>
        <div class="buttons">
            <a href="index.html"><button class="back-btn">Back</button></a>
            <button class="fullscreen-btn">Fullscreen</button>
        </div>
    </header>

    <main>
        <div class="game-box">
            <iframe src="https://wowinator.cloud/Iframes/EscapeRoadIframe.html" style="width: 100%; height: 100%; border: none; border-radius: 4px;"></iframe>
         </div>
    </main>

    
    <script>
        document.querySelector('.back-btn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
        document.querySelector('.fullscreen-btn').addEventListener('click', () => {
            const iframe = document.querySelector('iframe');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            }
        });
    </script>
</body>
</html>
