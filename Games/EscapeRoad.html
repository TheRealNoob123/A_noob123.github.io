<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Road</title>
    <link rel="stylesheet" href="pages.css">
</head>
<body>
    <header>
        <h1>Escape Road</h1>
        <a href="index.html"><button class="back-btn">Back</button></a>
    </header>

    <main>
        <div class="game-box">
            <iframe src="https://wowinator.cloud/Iframes/EscapeRoadIframe.html" style="width: 100%; height: 100%; border: none; border-radius: 4px;"></iframe>
         </div>
         <button><h2>Fullscreen</h2></button>
    </main>

    <script>
        document.querySelector('.back-btn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    </script>
    <script>
        const fullscreenBtn = document.querySelector('button');

        fullscreenBtn.addEventListener('click', () => {
            const newTab = window.open('about:blank', '_blank');
            
            setTimeout(() => {
                newTab.document.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            * {
                                margin: 0;
                                padding: 0;
                            }
                            body {
                                width: 100vw;
                                height: 100vh;
                                overflow: hidden;
                            }
                            iframe {
                                width: 100%;
                                height: 100%;
                                border: none;
                            }
                        </style>
                    </head>
                    <body>
                        <iframe src="Iframes/EscapeRoadIframe.html" allowfullscreen></iframe>
                    </body>
                    </html>
                `);
                newTab.document.close();
            }, 100);
        });
    </script>
</body>
</html>
