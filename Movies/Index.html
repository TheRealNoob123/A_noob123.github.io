<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Movies — Player</title>
  <link rel="stylesheet" href="movies.css" />
</head>
<body>
  <div id="player-container" class="player">
    <video id="movie" class="movie-player" controls preload="metadata" crossorigin playsinline tabindex="0">
      <!-- Replace or add <source> tags below with your movie files -->
      <!-- Example: <source src="Zootopia.mp4" type="video/mp4"> -->
      Your browser does not support the video tag.
    </video>

    <div class="controls-overlay">
      <button id="fs-btn" class="btn">Fullscreen</button>
      <button id="fit-btn" class="btn">Fit</button>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
